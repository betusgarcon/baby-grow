name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Java 17 + PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Testcontainers 使用 runner 自带的 Docker；docker-java.properties 固定 API 1.44
      - name: Test + coverage
        working-directory: babyGrowBackend
        run: ./mvnw -B verify
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: babyGrowBackend/target/site/jacoco
          if-no-files-found: ignore

  frontend:
    name: Frontend (type-check + jest + i18n + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C babyGrowFrontend type-check
      - run: pnpm -C babyGrowFrontend exec jest --runInBand
      - run: pnpm i18n:check
      - run: pnpm -C babyGrowFrontend build:weapp

  ai:
    name: AI (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e ".[dev]"
        working-directory: babyGrowAi
      - run: pytest -q
        working-directory: babyGrowAi
