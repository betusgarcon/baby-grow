    // Horizontal scroll button highlights

        styleButtons.forEach(b => {
          b.classList.remove('border-primary', 'text-on-primary-container', 'bg-primary/5');

        });
        this.classList.add('border-primary', 'text-on-primary-container', 'bg-primary/5');
        this.classList.remove('border-transparent', 'bg-surface-container', 'text-on-surface-variant');
      });
    });
