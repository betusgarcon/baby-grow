<script>
        let selectedItems = new Set();
        const body = document.body;
        const actionDock = document.getElementById('action-dock');
        const countDisplay = document.getElementById('selected-count');

        // Add pre-selected items based on HTML state
        document.querySelectorAll('.selection-active').forEach(container => {
            selectedItems.add(container.parentElement);
        });

        function toggleFilter() {
            body.classList.toggle('filter-open');
            body.classList.toggle('filter-closed');
        }

        function closeFilter() {
            body.classList.remove('filter-open');
            body.classList.add('filter-closed');
        }

        function toggleSelection(element) {
            const indicator = element.querySelector('.selection-indicator');
            const imgContainer = element.querySelector('.relative');
            
            if (selectedItems.has(element)) {
                selectedItems.delete(element);
                indicator.classList.replace('opacity-100', 'opacity-0');
                indicator.classList.replace('bg-primary', 'bg-black/20');
                imgContainer.classList.remove('ring-4', 'ring-primary/20', 'selection-active');
            } else {
                selectedItems.add(element);
                indicator.classList.replace('opacity-0', 'opacity-100');
                indicator.classList.replace('bg-black/20', 'bg-primary');
                imgContainer.classList.add('ring-4', 'ring-primary/20', 'selection-active');
            }

            updateDock();
        }

        function updateDock() {
            const count = selectedItems.size;
            countDisplay.innerText = count;

            if (count > 0) {
                actionDock.classList.remove('translate-y-32');
                actionDock.classList.add('translate-y-0');
            } else {
                actionDock.classList.add('translate-y-32');
                actionDock.classList.remove('translate-y-0');
            }
        }
    </script>
