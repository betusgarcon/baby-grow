<!-- Micro-interaction Script -->
<script>
        let count = 34;
        const target = 100;
        
        const countDisplay = document.getElementById('current-count');
        const progressBar = document.getElementById('progress-bar');
        const percentageDisplay = document.querySelector('.text-tertiary');

        function updateUI() {
            countDisplay.innerText = count;
            const percentage = (count / target) * 100;
            progressBar.style.width = `${percentage}%`;
            percentageDisplay.innerText = `${Math.round(percentage)}% Completed`;
            
            // Add a small bounce animation to the text
            countDisplay.classList.add('scale-110');
            setTimeout(() => countDisplay.classList.remove('scale-110'), 200);
        }

        function increment(val = 1) {
            if (count < target) {
                count += val;
                updateUI();
            }
        }

        function decrement() {
            if (count > 0) {
                count--;
                updateUI();
            }
        }
    </script>
<script>function showSaveFeedback() { const indicator = document.getElementById('save-indicator'); indicator.classList.remove('opacity-0'); indicator.classList.add('opacity-100'); setTimeout(() => { indicator.classList.remove('opacity-100'); indicator.classList.add('opacity-0'); }, 1500); }</script>
