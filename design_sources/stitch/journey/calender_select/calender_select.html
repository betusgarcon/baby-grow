          document.querySelectorAll('.grid button').forEach(b => {
            b.classList.remove('bg-secondary', 'text-on-secondary', 'font-bold', 'shadow-md', 'scale-110');
            if(!b.classList.contains('text-outline-variant')) b.classList.add('text-on-surface');
          });
          this.classList.add('bg-secondary', 'text-on-secondary', 'font-bold', 'shadow-md', 'scale-110');
          this.classList.remove('text-on-surface');
        }
      });
    });
