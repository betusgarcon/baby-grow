</button>
<h1 class="font-headline-md text-headline-md-mobile text-primary">Baby Profile</h1>

</button>

<main class="pt-24 pb-32 px-margin-mobile max-w-2xl mx-auto">

<img alt="Leo" class="w-full h-full object-cover" src="https://www.morganodriscoll.com/hqart2/2442-36_1.jpg">
</div>
<button class="absolute bottom-1 right-2 bg-primary text-on-primary p-2 rounded-full shadow-lg active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined text-[20px]">edit</span>
</button>
</div>
<div class="mt-md text-center">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Leo</h2>
<span class="inline-flex items-center px-sm py-1 bg-secondary-container text-on-secondary-fixed-variant rounded-full text-label-md font-label-md mt-xs">
<span class="material-symbols-outlined mr-1 text-[16px]">stars</span>
                    Little Lion
                </span>

</section>

</div>

<span class="material-symbols-outlined">face</span>
</div>
<div>
<p class="text-caption text-on-surface-variant">Gender</p>
<p class="font-headline-md text-on-surface">Boy</p>
</div>
</div>

<div class="col-span-2 md:col-span-1 glass-card p-md rounded-lg flex items-center gap-md"><div class="w-12 h-12 rounded-xl bg-tertiary-container flex items-center justify-center text-tertiary"><span class="material-symbols-outlined">auto_awesome</span></div><div><p class="text-caption text-on-surface-variant">Constellation</p><p class="font-headline-md text-on-surface">Leo</p></div></div></section>

<section>

<button class="text-primary text-label-md font-label-md">Edit All</button>
</div>
<div class="space-y-sm">

<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-surface-variant">toys</span>
</div>
<div class="flex-1">
<p class="text-label-md font-label-md text-on-surface">Favorite Toy</p>
<p class="text-body-md text-on-surface-variant">Soft blocks</p>

</div>

</div>

</main>

<script>
        // Micro-interactions
        document.querySelectorAll('.glass-card, [role="button"], button').forEach(el => {

                el.classList.add('opacity-80');
            });
            el.addEventListener('touchend', () => {
                el.classList.remove('opacity-80');
            });
        });
