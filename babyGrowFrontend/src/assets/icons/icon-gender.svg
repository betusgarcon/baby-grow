<svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- 性别：通用性别符号（圆圈 + 斜箭头）。原先画的是一个笑脸，
     既没表达性别、也容易和「情绪」功能混淆。
     描边加粗到 2.5，好和另外两个实心图标保持相近的视觉重量。 -->
<circle cx="8.6" cy="11.4" r="5.15" stroke="#5F5F59" stroke-width="2.5"/>
<path d="M12.6 7.4L17.1 2.9" stroke="#5F5F59" stroke-width="2.5" stroke-linecap="round"/>
<path d="M12.4 2.9H17.1V7.6" stroke="#5F5F59" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
