# baby-grow：小程序 → ECS nginx → FRP 隧道 → NAS 上 frpc 的 remotePort 3003。
#
# 这段由 deploy/ecs/init-nginx.sh 自动插入到 api.subetus.top 的 server 块内，
# 一般不需要手工粘贴。**这个文件会被原样写进 nginx 配置**，所以注释只保留
# 与配置本身有关的说明，安装步骤见 deploy/README.md。
#
# 端口 3003 必须与 deploy/nas/frpc.toml.template 的 remotePort、
# 以及 NAS 上 babygrow-api 的宿主端口三者一致。
# 路径前缀 /babygrow 必须与前端 .env.production 里的 TARO_APP_API_BASE_URL 一致。

location /babygrow/ {
    rewrite ^/babygrow/(.*)$ /$1 break;
    proxy_pass http://frps:3003;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 媒体上传走同一条路径（/babygrow/api/media/...），需要放宽体积上限。
    # 与 server 块里的 client_max_body_size 20m 保持一致即可。
    client_max_body_size 20m;
}
