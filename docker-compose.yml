# 本地开发用全栈一键启动：Redis + PostgreSQL/pgvector + Java 后端 + Python AI 服务
# 生产环境不在本文件管理范围内。
#
# 用法（仓库根目录）：
#   pnpm db:up                  # 只启动数据库与缓存
#   docker compose up -d        # 启动全部服务
#   docker compose logs -f      # 看日志
#
# 库的划分（见 docs/backend-design.md §4.1）：
#   baby_grow     业务库，Java 后端独占，schema 由 Flyway 管
#   baby_grow_ai  向量库，Python AI 服务独占
# 两者在同一个 PostgreSQL 实例里，但用独立账号隔开，确保 AI 侧读不到业务数据。
services:
  redis:
    image: redis:7-alpine
    container_name: baby-grow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    container_name: baby-grow-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: baby_grow_ai
      # 与后端容器必须一致。后端用 JVM 默认时区算「今天」，而 menu 的按天分桶 SQL 用
      # current_setting('TIMEZONE')——两者不一致时，「今天的推荐」会落在错误的一天上。
      # 显式钉住，别让容器默认的 UTC 悄悄决定业务日期。
      TZ: ${TZ:-Asia/Shanghai}
      # 业务库账号 babygrow 的密码。02-create-baby-grow-db.sh 从这里取，
      # 不再写死在脚本里——写死会让生产用上已知弱口令，且与 .env 里的
      # DB_PASSWORD 不一致（后端会直接连不上）。
      DB_PASSWORD: ${DB_PASSWORD:-babygrow-dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 注意：init 脚本只在数据目录为空时执行一次。已有数据卷需要手动补建业务库，
      # 见 docker/init-postgres/README.md。切勿用 `down -v` 清卷——那会一并删掉 RAG 向量。
      - ./docker/init-postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d baby_grow_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  ai-service:
    build:
      context: ./babyGrowAi
      dockerfile: Dockerfile
    container_name: baby-grow-ai-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      # 连接容器内的 PostgreSQL
      PG_DSN: postgresql://postgres:postgres@postgres:5432/baby_grow_ai
      # Ollama 默认跑在宿主机，容器内通过 host.docker.internal 访问
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:7b-instruct-q5_K_M
      EMBEDDING_MODEL: bge-m3:latest
      # 关闭热重载，Docker 内不需要
      UVICORN_RELOAD: "false"
      # 文生图（心愿头图）。与上面的文本模型完全独立的一路，
      # 因为 Ollama 不支持出图，所以没有本机退路。
      # 从仓库根的 .env 读，没填就是关闭状态，/health 会显示 image=unconfigured。
      IMAGE_MODEL_API_KEY: ${IMAGE_MODEL_API_KEY:-}
      IMAGE_MODEL_BASE_URL: ${IMAGE_MODEL_BASE_URL:-https://api.siliconflow.cn/v1}
      IMAGE_MODEL_NAME: ${IMAGE_MODEL_NAME:-Kwai-Kolors/Kolors}
      IMAGE_MODEL_SIZE: ${IMAGE_MODEL_SIZE:-1024x1024}
      IMAGE_MODEL_TIMEOUT: ${IMAGE_MODEL_TIMEOUT:-120}
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./babyGrowBackend
      dockerfile: Dockerfile
    container_name: baby-grow-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 业务库
      DB_URL: jdbc:postgresql://postgres:5432/baby_grow
      DB_USER: babygrow
      DB_PASSWORD: ${DB_PASSWORD:-babygrow-dev}
      # 见 postgres 服务里的说明：与数据库容器同值，否则「今天」会算错一天。
      # 小程序用户都在国内，所以默认东八区而不是 UTC。
      TZ: ${TZ:-Asia/Shanghai}
      # AI 服务走容器内网，不经过公网
      AI_SERVICE_URL: http://ai-service:8001
      # 容器里默认开启本地直通登录——这是本地开发栈，不开就没法登录（本地没有微信凭据）。
      # 与生产相反：生产 compose 走 .env，APP_AUTH_DEV_MODE=false 且有真实 JWT_SECRET。
      # 应用自身的默认值是 false，这里显式覆盖成 true，让「本地能跑」和「漏配即失败」
      # 两个目标各自成立。
      APP_AUTH_DEV_MODE: ${APP_AUTH_DEV_MODE:-true}
      JWT_SECRET: ${JWT_SECRET:-baby-grow-container-dev-secret-please-override-32b}
      WX_APPID: ${WX_APPID:-}
      WX_SECRET: ${WX_SECRET:-}
      # 心愿头图。默认关闭：出图打的是外部付费接口，AI 服务侧没配 IMAGE_MODEL_API_KEY
      # 就打开，只会让每条新心愿静默变成 failed。
      WISH_COVER_ENABLED: ${WISH_COVER_ENABLED:-false}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy

volumes:
  redis-data:
  postgres-data:
