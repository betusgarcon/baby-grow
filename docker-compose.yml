# 本地开发用全栈一键启动：Redis + PostgreSQL/pgvector + Java 后端 + Python AI 服务
# 生产环境不在本文件管理范围内。
#
# 用法（仓库根目录）：
#   pnpm db:up                  # 只启动数据库与缓存
#   docker compose up -d        # 启动全部服务
#   docker compose logs -f      # 看日志
#
# 库的划分（见 docs/backend-design.md §4.1）：
#   baby_grow     业务库，Java 后端独占，schema 由 Flyway 管
#   baby_grow_ai  向量库，Python AI 服务独占
# 两者在同一个 PostgreSQL 实例里，但用独立账号隔开，确保 AI 侧读不到业务数据。
services:
  redis:
    image: redis:7-alpine
    container_name: baby-grow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    container_name: baby-grow-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: baby_grow_ai
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 注意：init 脚本只在数据目录为空时执行一次。已有数据卷需要手动补建业务库，
      # 见 docker/init-postgres/README.md。切勿用 `down -v` 清卷——那会一并删掉 RAG 向量。
      - ./docker/init-postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d baby_grow_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  ai-service:
    build:
      context: ./babyGrowAi
      dockerfile: Dockerfile
    container_name: baby-grow-ai-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      # 连接容器内的 PostgreSQL
      PG_DSN: postgresql://postgres:postgres@postgres:5432/baby_grow_ai
      # Ollama 默认跑在宿主机，容器内通过 host.docker.internal 访问
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:7b-instruct-q5_K_M
      EMBEDDING_MODEL: bge-m3:latest
      # 关闭热重载，Docker 内不需要
      UVICORN_RELOAD: "false"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./babyGrowBackend
      dockerfile: Dockerfile
    container_name: baby-grow-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 业务库
      DB_URL: jdbc:postgresql://postgres:5432/baby_grow
      DB_USER: babygrow
      DB_PASSWORD: ${DB_PASSWORD:-babygrow-dev}
      # AI 服务走容器内网，不经过公网
      AI_SERVICE_URL: http://ai-service:8001
      # 容器里默认关闭本地直通登录；真机联调时可临时置 true
      APP_AUTH_DEV_MODE: ${APP_AUTH_DEV_MODE:-false}
      JWT_SECRET: ${JWT_SECRET:-baby-grow-container-dev-secret-please-override-32b}
      WX_APPID: ${WX_APPID:-}
      WX_SECRET: ${WX_SECRET:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy

volumes:
  redis-data:
  postgres-data:
