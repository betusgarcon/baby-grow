# 本地开发用 MySQL + Redis，供 babyGrowBackend 联调。
# 生产库不在本文件管理范围内。
#
# 用法（仓库根目录）：
#   pnpm db:up      # 启动
#   pnpm db:down    # 停止（数据卷保留）
#   pnpm db:logs    # 看日志
services:
  mysql:
    image: mysql:8
    container_name: baby-grow-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: babygrow-dev
      MYSQL_DATABASE: baby_grow
      MYSQL_USER: babygrow
      MYSQL_PASSWORD: babygrow-dev
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pbabygrow-dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: baby-grow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  redis-data: